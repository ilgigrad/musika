[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musika"
version = "0.1.0"
description = "Synthétiseur as code : composition, synthèse et mixage en Python"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "sounddevice",
    "attrs",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
